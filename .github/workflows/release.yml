# HSL/DHV Release — push tag v* 时自动四平台构建并发布
# 使用原生 GitHub-hosted runners，无需交叉编译工具链

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            exe: dhv
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: dhv.exe
            archive: zip
          - target: aarch64-apple-darwin
            runner: macos-latest
            exe: dhv
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            exe: dhv
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchain/dhv/target
          key: rust-${{ matrix.target }}-${{ hashFiles('toolchain/dhv/Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-

      - name: Build
        working-directory: toolchain/dhv
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: toolchain/dhv
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          strip "$EXE" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP"
          tar czf "$RUNNER_TEMP/dhv-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.exe }}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        working-directory: toolchain/dhv
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release/${{ matrix.exe }}"
          $dst = Join-Path $env:RUNNER_TEMP "dhv-${{ github.ref_name }}-windows-x86_64.zip"
          Compress-Archive -Path $src -DestinationPath $dst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhv-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ runner.temp }}/dhv-${{ github.ref_name }}-*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/,/^## \\[" CHANGELOG.md \
            | head -n -1 \
            > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "## ${TAG}" > /tmp/release-notes.md
            echo '' >> /tmp/release-notes.md
            echo 'See [CHANGELOG.md](https://github.com/myh2026/harness-specification-language/blob/main/CHANGELOG.md) for details.' >> /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DHV ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          files: /tmp/artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-release-ci:
    name: Post-release CI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: cargo test
        working-directory: toolchain/dhv
        run: cargo test --release --quiet
      - name: conformance
        working-directory: toolchain
        run: bash tests/run_conformance.sh
