# HSL/DHV CI — 每次推送 main 或 PR 时运行全量测试矩阵

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  # 手动触发面：任意分支可从 Actions 页面跑全量 CI —— PR 到非 main 工作分支
  # 时不自动触发（branches 过滤），此前只能靠合并到 main 才能验证；
  # workflow_dispatch 补上这个空档（修复分支的验证不再依赖合并）。
  workflow_dispatch:

# 避免同一 PR 重复运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: '1'

jobs:
  # ── Job 1: Rust 编译器测试 ──────────────────────────────
  rust-test:
    name: Rust test (cargo test --release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchain/dhv/target
          key: rust-${{ runner.os }}-${{ hashFiles('toolchain/dhv/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build & test
        working-directory: toolchain/dhv
        run: cargo test --release

  # ── Job 2: 双编译器一致性 ───────────────────────────────
  conformance:
    name: Dual-compiler conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchain/dhv/target
          key: rust-${{ runner.os }}-${{ hashFiles('toolchain/dhv/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build dhv release binary
        working-directory: toolchain/dhv
        run: cargo build --release

      - name: Run conformance suite
        working-directory: toolchain
        run: bash tests/run_conformance.sh

  # ── Job 3: dhv-ts 全量套件（fuzzing / 38 backends / CLI / stress）──
  dhv-ts-suite:
    name: dhv-ts full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run dhv-ts test suite
        working-directory: toolchain
        run: bun tests/hsl/run-all.ts
        timeout-minutes: 15

  # ── Job 6: HSL IDE 扩展（校验 + vsix 打包） ──────────────
  # 全链路 IDE（check/run/emit + 捆绑 dhv-ts）：发布级校验 + vsix 产物
  # （Release 的安装包由 release.yml 的 ide-vsix job 打同版本，此 job 先行门禁）。
  ide:
    name: HSL IDE (validate + vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: IDE 发布级校验（12 项：JSON / regex / 解析器单测 / 命令完整性）
        run: bun ide/tests/validate.js

      - name: Package vsix（捆绑 dhv-ts 工具链）
        run: bun scripts/package-ide.ts

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsl-ide-vsix
          path: dist-ide/*.vsix
          retention-days: 14
          if-no-files-found: error

  # ── Job 4: 版本号一致性守卫 ─────────────────────────────
  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract dhv version
        id: dhv
        working-directory: toolchain/dhv
        run: echo "version=$(grep -oP '(?<=^version = ")\d+\.\d+\.\d+' Cargo.toml)" >> $GITHUB_OUTPUT

      - name: Extract dhv-ts version
        id: dhv-ts
        working-directory: toolchain/dhv-ts
        run: |
          echo "version=$(grep -oP '(?<="version": ")\d+\.\d+\.\d+' package.json)" >> $GITHUB_OUTPUT

      - name: Verify versions match
        run: |
          if [ "${{ steps.dhv.outputs.version }}" != "${{ steps.dhv-ts.outputs.version }}" ]; then
            echo "ERROR: dhv=${{ steps.dhv.outputs.version }} != dhv-ts=${{ steps.dhv-ts.outputs.version }}"
            exit 1
          fi
          echo "OK: both at ${{ steps.dhv.outputs.version }}"

  # ── Job 5: dhv-ts 三平台矩阵（Windows / macOS / Linux）──
  # dhv-ts 是纯 Bun/TS 跨平台实现，测试套件自带 Windows 意识（run-all.ts 的
  # fwd() 把路径转正斜杠、os.tmpdir()/mkdtempSync/execFileSync 均跨平台），
  # 但路径语义与工具可用性差异（python3 -m py_compile、bash -n）只有在真实
  # 非 Linux runner 上才能暴露。Rust 编译矩阵成本高，且 dhv-ts-suite 已覆盖
  # ubuntu，故仅对 dhv-ts 套件做跨平台展开。
  dhv-ts-matrix:
    name: dhv-ts suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # emit 交叉语法校验调用 python3 -m py_compile（backends/validate.ts）；
      # setup-python 在 Windows 上会同时提供 python 与 python3 别名。
      # bash -n 依赖 Windows runner 自带的 Git for Windows bash.exe（在 PATH 中）。
      - name: Install Python (for python3 cross-validation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run dhv-ts test suite
        working-directory: toolchain
        shell: bash
        run: bun tests/hsl/run-all.ts
        timeout-minutes: 20

  # ── Job 7: python 产物 ruff 门禁（v0.2.64）────────────────
  # 「所有产物 ruff 检测均可通过」的执行级门禁：四语料 emit → ruff 0.16
  # 默认全规则集（E4/E7/E9/F/I001/PLR0124…）。生成器任何卫生回归
  # （F401 按需导入 / E701 单行 if / UP034 多余括号 / 复合赋值翻倍）
  # 在此 job 当场可见 —— 与 run-all.ts 内嵌断言（ruff 缺席跳过）互补：
  # 本 job 保证 ruff 真的在跑。
  ruff-gate:
    name: Python artifact ruff gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ruff 定位约定：scripts/ruff-gate.ts 找 PATH → ~/.local/bin
      - name: Install ruff (uv tool)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install ruff
          ruff --version

      - name: Run ruff gate (4 corpora → emit → ruff check)
        run: bun scripts/ruff-gate.ts

      # 带着真 ruff 再跑一遍套件 —— 让 run-all.ts 里「ruff 缺席时跳过」的
      # 断言在 CI 侧真实执行（本地裸跑无法覆盖的路径）。
      - name: Full suite with ruff on PATH
        working-directory: toolchain
        run: bun tests/hsl/run-all.ts
        timeout-minutes: 15
