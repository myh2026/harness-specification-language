# ============================================================================
# Quarter Tests — 15 分钟巡检（快车道）
# ----------------------------------------------------------------------------
# 触发：每 15 分钟（cron */15，GitHub Actions 支持的最短间隔为 5 分钟）
#       + 手动 workflow_dispatch
# 覆盖（用户指定的三件事）：
#   1. 实装工具链 —— cargo build --release 真实构建 dhv（Rust 编译器），
#      并用编译产物真实跑一次 check（二进制冒烟，非仅编译成功）
#   2. 3 个项目 —— nova（15 模块静态检查）/ dsh（剧本端到端：真实改文件
#      + 真跑测试）/ backends-demo（38 后端全测）
#   3. 38 后端全测 —— tests/verify_backends.ts：全部文件语法校验通过 +
#      零告警 + 注册表 38 后端 ↔ 产物语言集合双向全覆盖 + 静态 json 内容级
#      真解析（v0.2.52 起非法 JSON 红灯）
# 完善：任一 job 失败 → 自动创建/更新 scheduled-test-failure 标签 Issue，
#       恢复全绿自动评论并关闭
# 节奏分层：本工作流 = 15 分钟快车道（分钟级发现）；scheduled-tests.yml =
#       每日 UTC 20:30 全量深水区（110+ 用例 / fuzz / cargo test / 双编译器一致性）
# ============================================================================

name: Quarter Tests

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: quarter-tests
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: '1'
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. 实装工具链（cargo build --release + 二进制真实冒烟）────────────
  toolchain-build:
    name: 实装工具链（cargo build + dhv 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            toolchain/dhv/target
          key: rust-${{ runner.os }}-${{ hashFiles('toolchain/dhv/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: cargo build --release（实装 dhv）
        working-directory: toolchain/dhv
        run: cargo build --release
      - name: dhv 冒烟（编译产物真实运行 check nova）
        working-directory: toolchain
        run: ./dhv/target/release/dhv check examples/nova/nova.hsl

  # ── 2. 3 个项目回归 + 38 后端全测 ────────────────────────────────────
  three-projects:
    name: 3 项目（nova / dsh / backends-demo·38 后端全测）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: nova — 15 模块静态检查
        working-directory: toolchain
        run: bun dhv-ts/src/main.ts check examples/nova/nova.hsl
      - name: dsh — 剧本端到端（真实改文件 + 真跑测试）
        working-directory: toolchain
        run: |
          rm -rf /tmp/dsh-ws /tmp/dsh-run
          cp -r examples/dsh/workspace /tmp/dsh-ws
          bun dhv-ts/src/main.ts run examples/dsh/dsh.hsl \
            --workspace /tmp/dsh-ws \
            --task "stats.ts 中 variance() 的分母用错了（应为样本方差 n-1），且 median() 尚未实现。请修复并让 stats.test.ts 全部通过。" \
            --model scripted \
            --fixture examples/dsh/fixtures/fix-variance.json \
            --out /tmp/dsh-run
          python3 - <<'PYEOF'
          import json
          run = json.load(open('/tmp/dsh-run/run.json'))
          assert run['ok'] is True, run
          print('  ok: dsh 剧本端到端 run.ok=True')
          PYEOF
      - name: backends-demo — 38 后端全测（投射 + 全量覆盖校验）
        working-directory: toolchain
        run: |
          rm -rf /tmp/bd
          bun dhv-ts/src/main.ts emit examples/backends-demo/agent.hsl --out /tmp/bd
          bun tests/verify_backends.ts /tmp/bd

  # ── 3. 失败自动开 Issue（测试→跟踪→完善闭环）────────────────────────
  report:
    name: Auto-issue on failure
    needs: [toolchain-build, three-projects]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC';
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const LABEL = 'scheduled-test-failure';
            try {
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'd73a4a' });
            } catch (e) { /* 标签已存在 */ }
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL
            });
            if (failed.length === 0) {
              for (const it of open.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: it.number,
                  body: `✅ ${stamp} 定时测试恢复全绿。\n运行记录：${runUrl}`
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: it.number, state: 'closed'
                });
              }
              core.info('全绿：无失败需要报告');
              return;
            }
            const body = [
              `**${stamp} 定时测试失败（15 分钟巡检）**`,
              '',
              `失败矩阵：${failed.map(f => '`' + f + '`').join(' · ')}`,
              '',
              `运行记录：${runUrl}`,
              '',
              '> 此 Issue 由定时任务自动创建与维护；恢复全绿后自动评论并关闭。'
            ].join('\n');
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body
              });
              core.info(`已更新既有跟踪 Issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: '⏰ 定时测试失败（Quarter / Scheduled Tests）',
                body, labels: [LABEL]
              });
              core.info(`已创建跟踪 Issue #${created.data.number}`);
            }
